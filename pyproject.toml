[project]
name = "research-copilot-server"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Nayab-Sarfaraj", email = "nayabsarfaraj@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "dotenv>=0.9.9",
    "fastapi>=0.141.1",
    "inngest>=0.5.19",
    "langchain-groq>=1.1.3",
    "langgraph>=1.2.11",
    "psycopg2-binary>=2.9.13",
    "sqlalchemy>=2.0.54",
    "tavily-python>=0.8.4",
    "uvicorn[standard]>=0.53.0",
]

[project.scripts]
research-copilot-server = "research_copilot_server:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
